<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima LED Controller</title>
    <style>
        :root {
            --bg: #111827;
            --card-bg: #1f2937;
            --text: #f9fafb;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .app-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 20px; color: #fff; }
        
        .weather-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border); }
        .temp { font-size: 3rem; font-weight: 800; margin: 8px 0; color: #60a5fa; }
        .location { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .desc { font-size: 0.95rem; color: var(--text-dim); }

        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 12px; font-weight: 600; }

        .led-status { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; }
        .color-preview { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2); background: #000; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn { background: #374151; border: none; color: #fff; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: var(--accent); }
        .btn.active { background: var(--accent); }
        
        .ota-box { border-top: 1px solid var(--border); pt: 16px; margin-top: 16px; text-align: center; }
        .btn-ota { background: #059669; width: 100%; margin-top: 8px; }
        .btn-ota:hover { background: #10b981; }
        .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; background: #374151; color: var(--text-dim); }
    </style>
</head>
<body>

<div class="app-card">
    <h1>Clima & LED Controller</h1>

    <div class="weather-box" id="weather-box">
        <div class="location" id="loc-name">Cargando...</div>
        <div class="temp" id="loc-temp">--°C</div>
        <div class="desc" id="loc-desc">Consultando datos...</div>
    </div>

    <div class="section-title">Estado del LED Físico</div>
    <div class="led-status">
        <div>
            <div style="font-weight: 600;" id="led-mode">Modo: Cargando</div>
            <div style="font-size: 0.8rem; color: var(--text-dim);" id="led-rgb">RGB: (0, 0, 0)</div>
        </div>
        <div class="color-preview" id="led-preview"></div>
    </div>

    <div class="section-title">Seleccionar Ubicación</div>
    <div class="grid">
        <button class="btn active" onclick="loadRegion('actual', this)">📍 Mi Ubicación</button>
        <button class="btn" onclick="loadRegion('riad', this)">🏝️ Riad</button>
        <button class="btn" onclick="loadRegion('londres', this)">🇬🇧 Londres</button>
        <button class="btn" onclick="loadRegion('tromso', this)">❄️ Tromsø</button>
        <button class="btn" onclick="loadRegion('manaos', this)">🌴 Manaos</button>
        <button class="btn" onclick="loadRegion('tokio', this)">⛩️ Tokio</button>
    </div>

    <div class="ota-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: var(--text-dim);">Firmware OTA</span>
            <span class="badge" id="ota-status">v1.0.2</span>
        </div>
        <button class="btn btn-ota" id="btn-ota" onclick="triggerOTA()">🔄 Buscar y Actualizar Firmware</button>
    </div>
</div>

<script>
    async function loadRegion(regionKey, btnEl) {
        if(btnEl) {
            document.querySelectorAll('.grid .btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }
        document.getElementById('loc-name').textContent = "Consultando...";
        try {
            const res = await fetch(`/api/weather?region=${regionKey}`);
            const data = await res.json();
            document.getElementById('loc-name').textContent = data.region_name;
            document.getElementById('loc-temp').textContent = `${data.temperature}°C`;
            document.getElementById('loc-desc').textContent = data.description;

            document.getElementById('led-mode').textContent = `Modo: ${data.color_key}`;
            const [r, g, b] = data.led_color;
            document.getElementById('led-rgb').textContent = `RGB: (${r}, ${g}, ${b})`;
            document.getElementById('led-preview').style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        } catch(e) {
            document.getElementById('loc-desc').textContent = "Error al cargar datos";
        }
    }

    async function triggerOTA() {
        const btn = document.getElementById('btn-ota');
        const status = document.getElementById('ota-status');
        btn.disabled = true;
        btn.textContent = "Verificando...";
        try {
            const res = await fetch('/api/ota/check');
            const data = await res.json();
            if(data.update_available) {
                status.textContent = `Nueva v${data.remote_version}`;
                btn.textContent = "Instalando actualización...";
                const upRes = await fetch('/api/ota/update');
                const upData = await upRes.json();
                if(upData.success) {
                    btn.textContent = "¡Actualizado! Reiniciando...";
                    setTimeout(() => location.reload(), 6000);
                } else {
                    alert("Error: " + upData.message);
                    btn.disabled = false;
                }
            } else {
                status.textContent = "Al día";
                btn.textContent = "Sistema Actualizado (v1.0.2)";
                setTimeout(() => { btn.disabled = false; btn.textContent = "🔄 Buscar y Actualizar Firmware"; }, 3000);
            }
        } catch(e) {
            alert("Error de red");
            btn.disabled = false;
        }
    }

    // Cargar al inicio
    loadRegion('actual');
</script>

</body>
</html>
