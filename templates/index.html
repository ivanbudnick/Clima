<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima & LED Controller</title>
    <style>
        :root {
            --bg: #111827;
            --card-bg: #1f2937;
            --text: #f9fafb;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --border: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .app-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 20px; color: #fff; }
        
        .weather-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border); }
        .temp { font-size: 2.8rem; font-weight: 800; margin: 6px 0; color: #60a5fa; }
        .location { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .desc { font-size: 0.9rem; color: var(--text-dim); }

        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 10px; font-weight: 600; }

        .led-status { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.25); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
        .color-preview { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 12px rgba(255,255,255,0.3); background: #000; }

        .btn-live { background: #2563eb; width: 100%; padding: 12px; border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-bottom: 20px; transition: background 0.2s; }
        .btn-live:hover { background: #1d4ed8; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-preset { background: #374151; border: none; color: #fff; padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-preset:hover { background: #4b5563; }
        .btn-preset.active { background: #0284c7; }
        
        .ota-box { border-top: 1px solid var(--border); pt: 16px; margin-top: 16px; }
        .btn-ota { background: #059669; width: 100%; border: none; color: #fff; padding: 10px; border-radius: 10px; font-weight: 600; margin-top: 8px; cursor: pointer; }
        .btn-ota:hover { background: #10b981; }
        .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #374151; color: var(--text-dim); }
    </style>
</head>
<body>

<div class="app-card">
    <h1>Clima & Control LED</h1>

    <!-- Tarjeta Clima Actual -->
    <div class="weather-box">
        <div class="location" id="loc-name">Cargando...</div>
        <div class="temp" id="loc-temp">--°C</div>
        <div class="desc" id="loc-desc">Consultando datos...</div>
    </div>

    <!-- Botón Volver a Clima en Vivo -->
    <button class="btn-live" onclick="loadLiveWeather()">📍 Mi Ubicación (Clima en Vivo)</button>

    <!-- Estado Físico del LED -->
    <div class="section-title">Estado del LED Físico</div>
    <div class="led-status">
        <div>
            <div style="font-weight: 600;" id="led-mode">Modo: --</div>
            <div style="font-size: 0.8rem; color: var(--text-dim);" id="led-rgb">RGB: (0, 0, 0)</div>
        </div>
        <div class="color-preview" id="led-preview"></div>
    </div>

    <!-- Templates / Presets de Clima -->
    <div class="section-title">Templates / Presets de Clima</div>
    <div class="grid">
        <button class="btn-preset" onclick="applyPreset(0, 1, 'Día Despejado', this)">☀️ Soleado (Día)</button>
        <button class="btn-preset" onclick="applyPreset(0, 0, 'Noche Despejada', this)">🌙 Noche Despejada</button>
        <button class="btn-preset" onclick="applyPreset(3, 1, 'Nublado', this)">☁️ Nublado</button>
        <button class="btn-preset" onclick="applyPreset(45, 1, 'Niebla', this)">🌫️ Niebla</button>
        <button class="btn-preset" onclick="applyPreset(51, 1, 'Llovizna', this)">🌦️ Llovizna</button>
        <button class="btn-preset" onclick="applyPreset(61, 1, 'Lluvia', this)">🌧️ Lluvia (Gotas)</button>
        <button class="btn-preset" onclick="applyPreset(71, 1, 'Nieve', this)">❄️ Nieve</button>
        <button class="btn-preset" onclick="applyPreset(95, 1, 'Tormenta', this)">⛈️ Tormenta (Rayos)</button>
    </div>

    <!-- Actualización OTA -->
    <div class="ota-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.8rem; color: var(--text-dim);">Firmware OTA</span>
            <span class="badge" id="ota-status">v1.0.2</span>
        </div>
        <button class="btn-ota" id="btn-ota" onclick="triggerOTA()">🔄 Buscar y Actualizar Firmware</button>
    </div>
</div>

<script>
    function updateUI(name, temp, desc, mode, rgb) {
        document.getElementById('loc-name').textContent = name;
        document.getElementById('loc-temp').textContent = temp ? `${temp}°C` : '--°C';
        document.getElementById('loc-desc').textContent = desc;

        document.getElementById('led-mode').textContent = `Modo: ${mode}`;
        const [r, g, b] = rgb;
        document.getElementById('led-rgb').textContent = `RGB: (${r}, ${g}, ${b})`;
        document.getElementById('led-preview').style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    }

    async function loadLiveWeather() {
        document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
        document.getElementById('loc-name').textContent = "Consultando...";
        try {
            const res = await fetch('/api/weather?region=actual');
            const data = await res.json();
            updateUI(data.region_name, data.temperature, data.description, data.color_key, data.led_color);
        } catch(e) {
            document.getElementById('loc-desc').textContent = "Error consultando clima";
        }
    }

    async function applyPreset(code, isDay, name, btnEl) {
        document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
        if(btnEl) btnEl.classList.add('active');

        try {
            const res = await fetch(`/api/weather/custom?weather_code=${code}&is_day=${isDay}`);
            const data = await res.json();
            updateUI(`Template: ${name}`, data.temperature, data.description, data.color_key, data.led_color);
        } catch(e) {
            document.getElementById('loc-desc').textContent = "Error aplicando preset";
        }
    }

    async function triggerOTA() {
        const btn = document.getElementById('btn-ota');
        const status = document.getElementById('ota-status');
        btn.disabled = true;
        btn.textContent = "Verificando...";
        try {
            const res = await fetch('/api/ota/check');
            const data = await res.json();
            if(data.update_available) {
                status.textContent = `Nueva v${data.remote_version}`;
                btn.textContent = "Instalando actualización...";
                const upRes = await fetch('/api/ota/update');
                const upData = await upRes.json();
                if(upData.success) {
                    btn.textContent = "¡Actualizado! Reiniciando...";
                    setTimeout(() => location.reload(), 6000);
                } else {
                    alert("Error: " + upData.message);
                    btn.disabled = false;
                }
            } else {
                status.textContent = "Al día";
                btn.textContent = "Sistema Actualizado (v1.0.2)";
                setTimeout(() => { btn.disabled = false; btn.textContent = "🔄 Buscar y Actualizar Firmware"; }, 3000);
            }
        } catch(e) {
            alert("Error de red");
            btn.disabled = false;
        }
    }

    // Cargar clima en vivo al iniciar
    loadLiveWeather();
</script>

</body>
</html>
